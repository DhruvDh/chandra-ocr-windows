[project]
name = "chandra-ocr-windows"
version = "0.1.0"
description = "Chandra OCR endpoint, correctness workflow and Windows Intel inference"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
test = ["pytest==9.1.1"]
benchmark = [
  "chandra-ocr==0.2.0",
  "pillow==12.3.0",
  "reportlab==5.0.1",
  "pypdfium2==5.13.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
pythonpath = ["."]
